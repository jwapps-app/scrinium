server_tokens off;  # don't advertise the nginx version

server {
    listen 80;
    # Bodies are small everywhere except the two upload routes below. This
    # used to be 500m for every path, and FastAPI buffers a JSON body in
    # memory before parsing it — so an unauthenticated POST to /api/auth/login
    # could hand the 1 GB api container half a gigabyte to hold.
    client_max_body_size 1m;

    # Set once here; a location that declares any proxy_set_header of its own
    # loses all of these, which is how the share block drifted before.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    # nginx's own view of its peer: the tunnel for Cloudflare traffic, the
    # real client for anything on the LAN. The api rate-limits on this when
    # CF-Connecting-IP is absent or not to be believed (see TUNNEL_PEERS).
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    proxy_read_timeout 300s;

    # Security headers on every response. CSP is deliberately strict but
    # allows the inline styles/blobs the PWA and pdf.js need; no external
    # origins are permitted (self-hosted, everything is same-origin).
    add_header X-Content-Type-Options "nosniff" always;
    # The app is only reachable over https through the tunnel; pin that so a
    # downgrade attempt can't strip it.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;
    # connect-src must include blob: — PDF.js reads the document through an
    # XHR/fetch against a blob: object URL, which connect-src governs. Without
    # it the fetch is blocked and every PDF view fails ("Unexpected server
    # response (0)" / "Failed to fetch"). data: covers offline-cached bytes.
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' data: blob:; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; worker-src 'self' blob:; object-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'" always;

    root /usr/share/nginx/html;
    index index.html;

    # The two routes that carry documents. The iOS app uploads with one
    # multipart POST to /api/documents (it does not use the chunked
    # session), so the exact match matters: scoping this to /uploads/ alone
    # would 413 every scan from the phone over a megabyte.
    location = /api/documents {
        client_max_body_size 500m;
        proxy_pass http://api:8000;
    }
    location ^~ /api/documents/uploads/ {
        client_max_body_size 500m;
        proxy_pass http://api:8000;
    }

    location ^~ /api/ {
        proxy_pass http://api:8000;
    }

    # nginx's default mime.types has no entry for .mjs; browsers refuse to
    # run module scripts served as octet-stream (breaks the PDF.js worker).
    location ~* \.mjs$ {
        types { }
        default_type application/javascript;
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }

    # Share tokens travel in the path, so logging these lines would persist
    # working, auth-free document URLs in plain text (and ship them to any log
    # collector). The requests still reach the api; only the log line is dropped.
    location ^~ /api/share/ {
        access_log off;
        proxy_pass http://api:8000;
    }
}
