server {
    listen 80;
    client_max_body_size 500m;

    # Security headers on every response. CSP is deliberately strict but
    # allows the inline styles/blobs the PWA and pdf.js need; no external
    # origins are permitted (self-hosted, everything is same-origin).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; worker-src 'self' blob:; object-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'" always;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_read_timeout 300s;
    }

    # nginx's default mime.types has no entry for .mjs; browsers refuse to
    # run module scripts served as octet-stream (breaks the PDF.js worker).
    location ~* \.mjs$ {
        types { }
        default_type application/javascript;
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
