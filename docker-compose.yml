# Local/dev stack. Frontend runs separately via `npm run dev` (proxies /api).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://app:app@postgres:5432/app
      SECRET_KEY: dev-secret-change-me
      ALLOWED_ORIGINS: http://localhost:5173
      DATA_DIR: /data
      # A migration that cannot get its lock retries instead of parking
      # every other query behind it (nightly pg_dump, long export).
      MIGRATION_LOCK_TIMEOUT: ${MIGRATION_LOCK_TIMEOUT:-4s}
      MIGRATION_MAX_ATTEMPTS: ${MIGRATION_MAX_ATTEMPTS:-40}
      OCR_ENGINE: ${OCR_ENGINE:-tesseract}
      APPLE_OCR_URL: ${APPLE_OCR_URL:-}
      WATCH_DIR: /data/watch
      SPLIT_ON_SEPARATORS: ${SPLIT_ON_SEPARATORS:-0}
      TRASH_RETENTION_DAYS: ${TRASH_RETENTION_DAYS:-30}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FOLDER: ${MAIL_FOLDER:-INBOX}
    ports:
      - "8010:8000"
    volumes:
      - ./data:/data
    # Root stays (see the Dockerfile note) but with nothing it does not use:
    # no capability except overriding file permissions on the bind mount,
    # no way to gain any, and a ceiling on processes so a parser bug in
    # Ghostscript or poppler cannot fork the box flat.
    cap_drop: [ALL]
    cap_add: [DAC_OVERRIDE, FOWNER, CHOWN]
    security_opt: [no-new-privileges:true]
    pids_limit: 512
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: ./backend
    command: ["worker"]
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://app:app@postgres:5432/app
      SECRET_KEY: dev-secret-change-me
      DATA_DIR: /data
      OCR_ENGINE: ${OCR_ENGINE:-tesseract}
      APPLE_OCR_URL: ${APPLE_OCR_URL:-}
      WATCH_DIR: /data/watch
      WATCH_BATCH_SIZE: ${WATCH_BATCH_SIZE:-25}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
      WORKER_SINGLE: ${WORKER_SINGLE:-1}
      OCR_JOBS: ${OCR_JOBS:-3}
      OCR_FALLBACK_MINUTES: ${OCR_FALLBACK_MINUTES:-180}
      CONSUMED_RETENTION_DAYS: ${CONSUMED_RETENTION_DAYS:-0}
      SPLIT_ON_SEPARATORS: ${SPLIT_ON_SEPARATORS:-0}
      EXPORT_EVERY_DAYS: ${EXPORT_EVERY_DAYS:-0}
      EXPORT_KEEP: ${EXPORT_KEEP:-3}
      EXPORT_FORMAT: ${EXPORT_FORMAT:-folder}
      EXPORT_PART_GB: ${EXPORT_PART_GB:-10}
      PUSH_RELAY_URL: ${PUSH_RELAY_URL:-}
      PUSH_RELAY_API_KEY: ${PUSH_RELAY_API_KEY:-}
      TRASH_RETENTION_DAYS: ${TRASH_RETENTION_DAYS:-30}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-993}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FOLDER: ${MAIL_FOLDER:-INBOX}
      MAIL_POLL_SECONDS: ${MAIL_POLL_SECONDS:-300}
    volumes:
      - ./data:/data
    # Root stays (see the Dockerfile note) but with nothing it does not use:
    # no capability except overriding file permissions on the bind mount,
    # no way to gain any, and a ceiling on processes so a parser bug in
    # Ghostscript or poppler cannot fork the box flat.
    cap_drop: [ALL]
    cap_add: [DAC_OVERRIDE, FOWNER, CHOWN]
    security_opt: [no-new-privileges:true]
    pids_limit: 2048
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
