name: build

on:
  push:
    branches: [main]
    tags: ["v*"]

env:
  REGISTRY: ghcr.io
  ORG: jwapps-app

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install system dependencies
        run: sudo apt-get update -q && sudo apt-get install -y -q ghostscript

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        working-directory: backend
        run: pytest -q

  # Each architecture builds on its own native runner and pushes an untagged
  # image identified only by digest; the merge job below stitches the digests
  # into one multi-arch tag.
  #
  # The obvious alternative — one amd64 runner with QEMU and
  # `platforms: linux/amd64,linux/arm64` — is three lines instead of two jobs,
  # but the API image compiles ocrmypdf, Tesseract and Ghostscript, and under
  # emulation that turns a few minutes into the better part of an hour. arm64
  # runners are free for public repositories, so there is no reason to emulate.
  build:
    needs: test
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: [api, web]
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
          - component: api
            context: ./backend
          - component: web
            context: ./frontend
    steps:
      - uses: actions/checkout@v4

      - name: Name this platform
        id: platform
        run: echo "pair=${PLATFORM//\//-}" >> "$GITHUB_OUTPUT"
        env:
          PLATFORM: ${{ matrix.platform }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.ORG }}/scrinium-${{ matrix.component }}

      - id: push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          # No tags here: a tag pushed per-architecture would have each arch
          # overwrite the other. Push by digest and tag once, in merge.
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.ORG }}/scrinium-${{ matrix.component }},push-by-digest=true,name-canonical=true,push=true
          # Scoped per component and architecture — a shared scope would have
          # the two architectures evicting each other's layers.
          cache-from: type=gha,scope=${{ matrix.component }}-${{ steps.platform.outputs.pair }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}-${{ steps.platform.outputs.pair }}

      - name: Record digest
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.push.outputs.digest }}

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.component }}-${{ steps.platform.outputs.pair }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Combine the per-architecture digests into one manifest list, so
  # `docker pull` resolves to the right image on both amd64 and arm64.
  merge:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: [api, web]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.component }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.ORG }}/scrinium-${{ matrix.component }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern=v{{version}}

      - name: Create manifest list
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.ORG }}/scrinium-${{ matrix.component }}@sha256:%s ' *)

      - name: Verify both architectures are present
        run: |
          docker buildx imagetools inspect \
            ${{ env.REGISTRY }}/${{ env.ORG }}/scrinium-${{ matrix.component }}:${{ steps.meta.outputs.version }} \
            --raw | jq -r '.manifests[].platform | select(.architecture != "unknown") | "\(.os)/\(.architecture)"' | sort | tee /tmp/arches
          grep -qx linux/amd64 /tmp/arches
          grep -qx linux/arm64 /tmp/arches
