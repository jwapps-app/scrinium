# Production stack (Portainer or plain compose). Image-only — the host never
# builds; CI publishes to GHCR and the host pulls. Env vars via Portainer UI
# or an .env file. Host paths live under DATA_ROOT (default suits a Synology;
# set your own, e.g. DATA_ROOT=/srv/scrinium).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in Portainer}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    volumes:
      - ${DATA_ROOT:-/volume1/docker/scrinium}/postgres:/var/lib/postgresql/data
    mem_limit: ${POSTGRES_MEM_LIMIT:-2g}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    image: ghcr.io/jwapps-app/scrinium-api:latest
    environment:
      ENVIRONMENT: production
      APP_NAME: ${APP_NAME:-Scrinium}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-app}
      SECRET_KEY: ${SECRET_KEY:?set in Portainer}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://scrinium.example.com}
      DATA_DIR: /data
      # A migration that cannot get its lock retries instead of parking
      # every other query behind it (nightly pg_dump, long export).
      MIGRATION_LOCK_TIMEOUT: ${MIGRATION_LOCK_TIMEOUT:-4s}
      MIGRATION_MAX_ATTEMPTS: ${MIGRATION_MAX_ATTEMPTS:-40}
      OCR_ENGINE: ${OCR_ENGINE:-tesseract}
      OCR_LANGUAGES: ${OCR_LANGUAGES:-eng}
      APPLE_OCR_URL: ${APPLE_OCR_URL:-}
      WATCH_DIR: /data/watch
      SPLIT_ON_SEPARATORS: ${SPLIT_ON_SEPARATORS:-0}
      TRASH_RETENTION_DAYS: ${TRASH_RETENTION_DAYS:-30}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FOLDER: ${MAIL_FOLDER:-INBOX}
    volumes:
      - ${DATA_ROOT:-/volume1/docker/scrinium}/data:/data
    mem_limit: 1g
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    image: ghcr.io/jwapps-app/scrinium-api:latest
    command: ["worker"]
    # Scale for bulk ingests (WORKER_REPLICAS=2 or 3): replicas share the job
    # queue safely; only one runs the watch-folder sweep at a time.
    deploy:
      replicas: ${WORKER_REPLICAS:-1}
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-app}
      SECRET_KEY: ${SECRET_KEY}
      DATA_DIR: /data
      OCR_ENGINE: ${OCR_ENGINE:-tesseract}
      OCR_LANGUAGES: ${OCR_LANGUAGES:-eng}
      APPLE_OCR_URL: ${APPLE_OCR_URL:-}
      WATCH_DIR: /data/watch
      WATCH_BATCH_SIZE: ${WATCH_BATCH_SIZE:-25}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
      WORKER_SINGLE: ${WORKER_SINGLE:-1}
      OCR_JOBS: ${OCR_JOBS:-3}
      OCR_FALLBACK_MINUTES: ${OCR_FALLBACK_MINUTES:-180}
      CONSUMED_RETENTION_DAYS: ${CONSUMED_RETENTION_DAYS:-0}
      SPLIT_ON_SEPARATORS: ${SPLIT_ON_SEPARATORS:-0}
      EXPORT_EVERY_DAYS: ${EXPORT_EVERY_DAYS:-0}
      EXPORT_KEEP: ${EXPORT_KEEP:-3}
      EXPORT_FORMAT: ${EXPORT_FORMAT:-folder}
      EXPORT_PART_GB: ${EXPORT_PART_GB:-10}
      PUSH_RELAY_URL: ${PUSH_RELAY_URL:-}
      PUSH_RELAY_API_KEY: ${PUSH_RELAY_API_KEY:-}
      TRASH_RETENTION_DAYS: ${TRASH_RETENTION_DAYS:-30}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-993}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FOLDER: ${MAIL_FOLDER:-INBOX}
      MAIL_POLL_SECONDS: ${MAIL_POLL_SECONDS:-300}
    volumes:
      - ${DATA_ROOT:-/volume1/docker/scrinium}/data:/data
    mem_limit: ${WORKER_MEM_LIMIT:-2g}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: ghcr.io/jwapps-app/scrinium-web:latest
    ports:
      - "${APP_PORT:-8220}:80"
    mem_limit: 256m
    restart: unless-stopped
    depends_on:
      - api

  backup:
    image: postgres:16
    # --exclude-table-data=document_pages: the page search index is 9 GB of a
    # 13 GB database and is derived entirely from documents.text_content — a
    # trigger rebuilds it on write, and the worker sweep repopulates anything
    # missing, so a restore heals itself. Keeping it made the nightly dump
    # three times longer than it needs to be, and every minute of dump is a
    # minute a deploy's migration has to wait for its lock. The table
    # definition and trigger are still dumped; only the rows are skipped.
    # A literal block, and a list-form entrypoint, on purpose. Written as a
    # folded scalar (>), YAML turned the indented continuation lines into real
    # newlines, which the shell reads as statement separators: `pg_dump ... -Fc`
    # ran on its own — whole database, no exclusion, straight to the container
    # log — and the next line began `--exclude-table-data=...: not found`,
    # feeding an empty pipe. gzip still succeeded, so `&&` still ran the
    # deletion: empty dumps written, good ones pruned on schedule. Here every
    # line is a complete statement and a newline means what it looks like.
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -u
        INTERVAL=${BACKUP_INTERVAL_SECONDS:-86400}
        KEEP=${BACKUP_KEEP:-3}
        # Completed dumps only: *.dump now, *.dump.gz from before the pointless
        # second round of compression was dropped. The in-progress file is
        # hidden so neither glob can ever see a half-written dump.
        GLOB='/backups/*.dump*'
        TMP=/backups/.in-progress
        rm -f "$$TMP"
        while true; do
          newest=$$(ls -t $$GLOB 2>/dev/null | head -1)
          last=0
          if [ -n "$$newest" ]; then last=$$(stat -c %Y "$$newest"); fi
          age=$$(( $$(date +%s) - last ))
          # Sleeping first, and only for what is left of the interval, is what
          # keeps a deploy from triggering a dump: this container is recreated
          # on every stack update, and dumping before sleeping turned eight
          # repulls in a day into eight 5 GB dumps.
          if [ "$$age" -lt "$$INTERVAL" ]; then
            sleep $$(( INTERVAL - age ))
            continue
          fi
          out=/backups/$$(date +%Y%m%d-%H%M%S).dump
          # -Fc is already zlib-compressed, so the old `| gzip` was a second
          # pass over the same bytes for nothing — and it hid pg_dump's exit
          # status behind gzip's, so a failed dump left a truncated file that
          # looked fine. No pipe, so a failure is visible and discarded.
          if pg_dump -h postgres -U ${POSTGRES_USER:-app} -Fc \
               --exclude-table-data=document_pages ${POSTGRES_DB:-app} > "$$TMP"; then
            mv "$$TMP" "$$out"
            ls -t $$GLOB 2>/dev/null | tail -n +$$(( KEEP + 1 )) | xargs -r rm -f
          else
            echo "backup: pg_dump failed, keeping the previous dumps" >&2
            rm -f "$$TMP"
          fi
          sleep "$$INTERVAL"
        done
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ${DATA_ROOT:-/volume1/docker/scrinium}/backups:/backups
    mem_limit: 256m
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
